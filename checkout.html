<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ComandUp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="Designer.png" alt="ComandUp Logo">
            <h1>ComandUp</h1>
        </div>
        <a href="index.html" class="btn" style="background: var(--dark);">Volver al Inicio</a>
    </header>

    <div class="container">
        <h2 style="color: var(--primary); text-align: center; margin-bottom: 20px;">Completar Suscripción</h2>
        <p style="text-align: center; margin-bottom: 30px; font-weight: bold;">Plan Pro: $999.00 MXN / mes</p>
        
        <form id="paymentForm">
            <p style="color: red; font-size: 12px; margin-bottom: 10px;">* Modo Prueba: No ingreses datos bancarios reales.</p>
            
            <div class="form-group">
                <label>Nombre en la tarjeta</label>
                <input type="text" placeholder="Ej. Yandi Melina" required>
            </div>
            
            <div class="form-group">
                <label>Número de Tarjeta</label>
                <input type="text" placeholder="0000 0000 0000 0000" maxlength="16" required>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Fecha de Expiración</label>
                    <input type="text" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>CVV</label>
                    <input type="text" placeholder="123" maxlength="3" required>
                </div>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 15px; background: var(--primary);">Pagar Suscripción</button>
        </form>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página recargue
            alert("¡Pago simulado exitoso! Tu restaurante ahora está protegido con ComandUp.");
            window.location.href = "index.html"; // Redirige al inicio
        });
    </script>
</body>
</html>

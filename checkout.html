<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adquirir Licencia | ComandUp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--light, #f4f7f6);">

    <header class="animate-fade">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="Designer.png" alt="ComandUp Logo" style="height: 40px;">
            <h1>ComandUp</h1>
        </div>
        <a href="index.html" class="btn">Cancelar y Volver</a>
    </header>

    <div class="checkout-wrapper animate-up" style="padding: 40px 8%;">
        <div class="checkout-card" style="display: flex; gap: 30px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex-wrap: wrap;">
            
            <!-- Columna Izquierda: Panel Dinámico -->
            <div class="checkout-summary" style="flex: 1; min-width: 300px; background: #008f68; color: white; padding: 25px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h3 style="margin-top: 0; color: white;"><i class="fa-solid fa-cart-shopping"></i> Resumen del Pedido</h3>
                    
                    <!-- Aquí inyectaremos los beneficios con JS -->
                    <ul id="listaBeneficios" style="list-style: none; padding: 0; line-height: 2;">
                        <!-- Se llena automáticamente al cargar -->
                    </ul>
                </div>
                
                <div style="margin-top: 20px; font-size: 24px; font-weight: bold; color: white;" id="totalPrice">
                    <!-- Se llena automáticamente al cargar -->
                </div>
            </div>
            
            <!-- Columna Derecha: Formulario -->
            <div class="checkout-form-container" style="flex: 2; min-width: 300px;">
                <h3 style="margin-top: 0;">Detalles de la Cuenta y Pago</h3>
                <form id="paymentForm">
                    
                    <h4 style="margin-bottom: 10px; color: #666; font-size: 14px;">1. Elige tu Plan</h4>
                    <div class="input-wrapper" style="margin-bottom: 20px;">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="planSelect" required style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 5px; appearance: none; background: white;">
                            <!-- Lo ponemos como Premium por defecto -->
                            <option value="Premium" selected>ComandUp Premium - $999 MXN / Mes</option>
                            <option value="Pro">ComandUp Pro - $8,990 MXN / Año (Ahorras 25%)</option>
                            <option value="Basico">ComandUp Básico - $499 MXN / Mes</option>
                        </select>
                    </div>

                    <h4 style="margin-bottom: 10px; color: #666; font-size: 14px;">2. Crea tu cuenta</h4>
                    <div class="input-wrapper" style="margin-bottom: 10px;">
                        <i class="fa-solid fa-store"></i>
                        <input type="text" id="restauranteName" placeholder="Nombre del Restaurante" required style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div class="input-wrapper" style="margin-bottom: 10px;">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="customerEmail" placeholder="Correo corporativo" required style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    <div class="input-wrapper" style="margin-bottom: 20px;">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="accountPassword" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6" style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>

                    <h4 style="margin-bottom: 10px; color: #666; font-size: 14px;">3. Método de Pago Seguro</h4>
                    <div class="input-wrapper" style="margin-bottom: 10px;">
                        <i class="fa-regular fa-credit-card"></i>
                        <input type="text" id="cardNumber" placeholder="Número de Tarjeta (16 dígitos)" maxlength="16" required style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 5px;">
                    </div>
                    
                    <button id="btnSubmit" type="submit" class="btn" style="width: 100%; font-size: 16px; padding: 15px; background: #008f68; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                        <i class="fa-solid fa-shield-halved"></i> Procesar Pago y Crear Cuenta
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // DICCIONARIO DE BENEFICIOS POR PLAN
        const beneficiosPlanes = {
            'Basico': `
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Licencia ComandUp Básica</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Reporte de tickets (Comando Manual)</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Soporte técnico por correo</li>
            `,
            'Premium': `
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Licencia ComandUp Premium</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Alertas de Menú Agotado (Módulo 86)</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Corte de caja automático a WhatsApp</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Soporte técnico directo (WhatsApp)</li>
            `,
            'Pro': `
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Licencia Oficial ComandUp Pro</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Alertas antifraude en tiempo real</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Integración Multi-Sucursal unificada</li>
                <li><i class="fa-solid fa-circle-check" style="color: #a3e6cd;"></i> Soporte prioritario 24/7 (Línea directa)</li>
            `
        };

        const preciosPlanes = {
            'Basico': '$499.00 <span style="font-size: 14px; color: #d1f2e6;">MXN / mes</span>',
            'Premium': '$999.00 <span style="font-size: 14px; color: #d1f2e6;">MXN / mes</span>',
            'Pro': '$8,990.00 <span style="font-size: 14px; color: #d1f2e6;">MXN / año</span>'
        };

        // Escucha cuando el cliente cambia el plan en el menú desplegable
        const planSelect = document.getElementById('planSelect');
        planSelect.addEventListener('change', function() {
            const plan = this.value;
            document.getElementById('listaBeneficios').innerHTML = beneficiosPlanes[plan];
            document.getElementById('totalPrice').innerHTML = preciosPlanes[plan];
        });

        // Simular un cambio al entrar para que cargue la info del "Premium" por defecto
        planSelect.dispatchEvent(new Event('change'));

        // Formato visual tarjeta
        document.getElementById('cardNumber').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').substring(0, 16);
        });

        // ENVÍO AL SERVIDOR
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const btnSubmit = document.getElementById('btnSubmit');
            const cardNumber = document.getElementById('cardNumber').value;
            
            if (cardNumber.length < 16) {
                alert("Ingresa los 16 números de tu tarjeta.");
                return;
            }

            const restaurante = document.getElementById('restauranteName').value;
            const email = document.getElementById('customerEmail').value;
            const password = document.getElementById('accountPassword').value;
            const plan = document.getElementById('planSelect').value;

            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
            btnSubmit.disabled = true;

            try {
                // RECUERDA PONER TU ENLACE DE RAILWAY AQUÍ
                const urlRailway = 'https://comandup-webhook-production.up.railway.app/api/register';
                const respuesta = await fetch(urlRailway, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ restaurante, email, password, plan })
                });

                const datos = await respuesta.json();
                if (datos.success) {
                    alert(`¡Transacción Exitosa!\nTu cuenta ha sido creada. Inicia sesión.`);
                    window.location.href = "login.html"; 
                } else {
                    alert("Error: " + datos.mensaje);
                }
            } catch (error) {
                alert("Error de red.");
            } finally {
                btnSubmit.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Procesar Pago y Crear Cuenta';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>

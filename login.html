<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | ComandUp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--light); display: flex; flex-direction: column; min-height: 100vh;">

    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="Designer.png" alt="ComandUp Logo">
            <h1>ComandUp</h1>
        </div>
        <a href="index.html" class="btn">Volver al Inicio</a>
    </header>

    <section style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div class="checkout-card" style="max-width: 400px; width: 100%; padding: 40px; text-align: center;">
            <h2 style="margin-bottom: 10px; color: var(--dark);">Bienvenido de nuevo</h2>
            <p style="color: var(--gray); margin-bottom: 25px; font-size: 14px;">Ingresa tus credenciales para acceder a tu panel.</p>
            
            <form id="loginForm">
                <div class="input-wrapper" style="margin-bottom: 15px;">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Correo corporativo" required>
                </div>
                
                <div class="input-wrapper" style="margin-bottom: 25px;">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px;">
                    Iniciar Sesión
                </button>
            </form>

            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <p style="font-size: 14px; color: var(--gray);">¿No tienes una cuenta?</p>
                <a href="checkout.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">Adquirir Plan y Registrarse</a>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // REEMPLAZA CON TU ENLACE DE RAILWAY
                const respuesta = await fetch('https://comandup-webhook-production.up.railway.app/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    localStorage.setItem('usuarioLogueado', JSON.stringify(datos.usuario));
                    window.location.href = datos.usuario.rol === 'admin' ? 'dashboard_admin.html' : 'client_portal.html';
                } else {
                    alert("Error: " + datos.mensaje);
                }
            } catch (error) {
                alert("Fallo de conexión al servidor.");
            }
        });
    </script>
</body>
</html>

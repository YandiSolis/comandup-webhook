<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal del Cliente | ComandUp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--light); display: flex; flex-direction: column; min-height: 100vh;">

    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="Designer.png" alt="ComandUp Logo">
            <h1>ComandUp</h1>
        </div>
        <button onclick="cerrarSesion()" class="btn" style="background: transparent; border: 1px solid white;">Cerrar Sesión</button>
    </header>

    <section style="flex: 1; padding: 60px 8%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h2 style="font-size: 32px; color: var(--dark);">Bienvenido, <span id="lblRestaurante" style="color: var(--primary);">Cargando...</span></h2>            
            <span id="badgeEstado" style="background: #e3fcef; color: #006644; padding: 8px 15px; border-radius: 20px; font-weight: 600; font-size: 14px;">
                <i class="fa-solid fa-check-circle"></i> Suscripción Activa
            </span>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
            <div>
                <div class="feature-box" style="margin-bottom: 30px; border-left: 5px solid var(--primary);">
                    <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-file-invoice-dollar" style="color: var(--primary);"></i> Detalles de Suscripción</h3>
                    <p style="color: var(--gray);" id="lblPlan"><strong>Plan:</strong> Cargando...</p>
                    <p style="color: var(--gray);" id="lblVencimiento"><strong>Próxima renovación:</strong> Cargando...</p>
                    <p style="color: var(--gray);"><strong>Servidor Railway:</strong> Protegido y Operativo <i class="fa-solid fa-cloud" style="color: var(--primary);"></i></p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // LÓGICA DE SEGURIDAD Y DATOS DINÁMICOS
        document.addEventListener('DOMContentLoaded', () => {
            const sesionActiva = localStorage.getItem('usuarioLogueado');
            
            // Si no hay sesión, lo expulsamos al login
            if (!sesionActiva) {
                window.location.href = 'login.html';
                return;
            }

            // Si sí hay sesión, parseamos los datos reales del usuario
            const usuario = JSON.parse(sesionActiva);

            // Inyectamos los datos reales en el HTML
            document.getElementById('lblRestaurante').innerText = `Restaurante "${usuario.restaurante}"`;
            document.getElementById('lblPlan').innerHTML = `<strong>Plan Activo:</strong> ComandUp ${usuario.plan}`;
            
            // Formatear la fecha (Quitar la T de la zona horaria)
            const fechaLimpia = usuario.fecha_vencimiento.split('T')[0];
            document.getElementById('lblVencimiento').innerHTML = `<strong>Próxima renovación:</strong> ${fechaLimpia}`;
        });

        // FUNCIÓN PARA CERRAR SESIÓN
        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado'); // Borramos la memoria
            window.location.href = 'index.html'; // Lo mandamos al inicio
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo | ComandUp SaaS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: white; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px; border-left: 5px solid #2b3a4a; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table-container { background: white; padding: 25px; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8f9fa; padding: 15px; color: #333; font-size: 14px; border-bottom: 2px solid #eee; }
        td { padding: 15px; color: #666; font-size: 14px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body style="background: var(--light, #f4f7f6); margin: 0; display: flex; flex-direction: column; min-height: 100vh;">

    <header style="padding: 15px 8%; background: #2b3a4a; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fa-solid fa-server" style="color: white; font-size: 24px;"></i>
            <h1 style="color: white; margin: 0; font-size: 20px;">Control Global SaaS</h1>
        </div>
        
        <!-- Botones de Navegación -->
        <div style="display: flex; gap: 10px;">
            <a href="index.html" class="btn" style="background: transparent; color: white; border: 1px solid white; text-decoration: none; padding: 10px 20px; border-radius: 5px;">
                <i class="fa-solid fa-house"></i> Inicio
            </a>
            <button onclick="cerrarSesion()" class="btn" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
        </div>
    </header>

    <section style="flex: 1; padding: 40px 8%;">
        <div class="admin-grid">
            <div class="metric-card">
                <div><i class="fa-solid fa-store" style="font-size: 32px; color: #2b3a4a;"></i></div>
                <div><h4 style="margin: 0; color: #666;">Clientes Activos</h4><p id="totalClientes" style="margin: 5px 0 0 0; font-size: 24px; font-weight: bold; color: #333;">...</p></div>
            </div>
        </div>

        <div class="table-container">
            <h3 style="margin-top: 0; margin-bottom: 20px;"><i class="fa-solid fa-users-gear"></i> Portafolio y Finanzas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Restaurante</th>
                        <th>Plan</th>
                        <th>Cantidad Pagada</th>
                        <th>Inicio de Cuenta</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes">
                    <tr><td colspan="6" style="text-align: center;">Cargando base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sesionActiva = localStorage.getItem('usuarioLogueado');
            if (!sesionActiva || JSON.parse(sesionActiva).rol !== 'admin') return window.location.href = 'login.html';

            try {
                // RECUERDA PONER TU ENLACE DE RAILWAY AQUÍ
                const respuesta = await fetch('https://comandup-webhook-production.up.railway.app/api/clientes');
                const datos = await respuesta.json();

                if (datos.success) {
                    let htmlFilas = '';
                    datos.clientes.forEach(cliente => {
                        const inicio = cliente.fecha_inicio.split('T')[0];
                        const vencimiento = cliente.fecha_vencimiento.split('T')[0];
                        
                        // Calculamos el monto cobrado según el plan
                        let monto = '';
                        if (cliente.plan === 'Pro') monto = '<span style="color: #008f68; font-weight: bold;">$8,990.00 / año</span>';
                        else if (cliente.plan === 'Premium') monto = '<b>$999.00 / mes</b>';
                        else monto = '<b>$499.00 / mes</b>';
                        
                        htmlFilas += `
                            <tr>
                                <td style="font-weight: bold; color: #2b3a4a;">${cliente.restaurante}</td>
                                <td>${cliente.plan}</td>
                                <td>${monto}</td>
                                <td>${inicio}</td>
                                <td>${vencimiento}</td>
                                <td><span style="background: #e3fcef; color: #006644; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">Activo</span></td>
                            </tr>
                        `;
                    });
                    document.getElementById('tablaClientes').innerHTML = htmlFilas;
                    document.getElementById('totalClientes').innerText = datos.clientes.length;
                }
            } catch (error) {
                document.getElementById('tablaClientes').innerHTML = '<tr><td colspan="6" style="color: red; text-align: center;">Error de conexión.</td></tr>';
            }
        });

        function cerrarSesion() { localStorage.removeItem('usuarioLogueado'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
